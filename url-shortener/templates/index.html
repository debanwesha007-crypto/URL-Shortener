<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Shortener</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <h1>🔗 URL Shortener</h1>
    <p class="subtitle">Paste a long URL, get a short one back.</p>

    <form id="shorten-form">
      <input type="text" id="url-input" placeholder="https://example.com/some/very/long/url" required>
      <input type="text" id="custom-code-input" placeholder="custom code (optional)">
      <button type="submit">Shorten</button>
    </form>

    <div id="result" class="result hidden">
      <span id="short-url-text"></span>
      <button id="copy-btn">Copy</button>
    </div>
    <p id="error-text" class="error hidden"></p>

    <h2>Recent links</h2>
    <table id="urls-table">
      <thead>
        <tr><th>Short</th><th>Original</th><th>Clicks</th><th></th></tr>
      </thead>
      <tbody id="urls-body"></tbody>
    </table>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
